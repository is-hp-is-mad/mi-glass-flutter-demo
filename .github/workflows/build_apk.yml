name: build android apk

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.35.7

jobs:
  build-apk:
    name: Build Universal Android APK & AAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch MiSans font
        working-directory: showcase
        shell: bash
        run: |
          curl -fL --retry 8 --retry-all-errors --retry-delay 5 -C - -o "$RUNNER_TEMP/MiSans.zip" https://hyperos.mi.com/font-download/MiSans.zip
          python tool/fetch_misans.py "$RUNNER_TEMP/MiSans.zip"

      - name: Flutter pub get & analyze
        working-directory: showcase
        run: |
          flutter pub get
          flutter analyze

      - name: Build Universal Release APK (小米原生 / 小米移植 / Flutter移植 三合一 Demo)
        working-directory: showcase
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/hyper-glass-universal-demo.apk
          ls -lh build/app/outputs/flutter-apk/
          ls -lh build/hyperglass/outputs/aar/ || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyper-glass-universal-apk
          path: |
            showcase/build/app/outputs/flutter-apk/app-release.apk
            showcase/build/app/outputs/flutter-apk/hyper-glass-universal-demo.apk
          if-no-files-found: error

      - name: Upload Standalone HyperGlass AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperglass-sdk-aar
          path: |
            showcase/build/hyperglass/outputs/aar/*.aar
            hyperglass-sdk/hyperglass/build/outputs/aar/*.aar
          if-no-files-found: warn

      - name: Publish GitHub Release (APK & AAR)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-universal
          name: "HyperGlass Universal SDK & 3-Mode Demo APK (小米原生 / 小米移植 / Flutter移植)"
          body: |
            ### 交付产物
            1. **`hyper-glass-universal-demo.apk` / `app-release.apk`**：三合一渲染引擎手动切换 Demo（支持 **小米原生** `xiaomi_native`、**小米移植** `xiaomi_port`、**安卓低版本 Flutter 移植版** `flutter_port` 实时切换对比）。
            2. **`hyperglass-release.aar`**：彻底脱离小米 ROM 私有框架绑定的全品牌 Android 通用柔光玻璃与混色模糊独立 AAR 库（`com.hyperos.glass`）。
          files: |
            showcase/build/app/outputs/flutter-apk/hyper-glass-universal-demo.apk
            showcase/build/app/outputs/flutter-apk/app-release.apk
            showcase/build/hyperglass/outputs/aar/hyperglass-release.aar
        continue-on-error: true
