name: capture

# Builds the demo on each desktop OS, runs its scripted capture mode (MIGLASS_CAPTURE=1) and uploads
# the screenshots plus a frame-time / memory curve as artifacts.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.35.7

jobs:
  capture:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb libgl1-mesa-dri mesa-utils fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch MiSans (official download, not redistributed)
        run: python tool/fetch_misans.py

      - run: flutter pub get
      - run: flutter analyze

      - name: Build
        shell: bash
        run: flutter build ${{ matrix.label }} --release

      - name: Run capture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MIGLASS_CAPTURE = '1'
          $env:MIGLASS_OUT = "$PWD\ci_out"
          $p = Start-Process build\windows\x64\runner\Release\hyper_glass.exe -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw 'capture timed out' }
          Get-ChildItem ci_out

      - name: Run capture (Linux)
        if: runner.os == 'Linux'
        run: |
          export MIGLASS_CAPTURE=1 MIGLASS_OUT=$PWD/ci_out
          timeout 240 xvfb-run -a -s "-screen 0 1920x1080x24" build/linux/x64/release/bundle/hyper_glass
          ls -la ci_out

      - name: Run capture (macOS)
        if: runner.os == 'macOS'
        run: |
          export MIGLASS_CAPTURE=1 MIGLASS_OUT=$PWD/ci_out
          app=$(ls -d build/macos/Build/Products/Release/*.app)
          "$app/Contents/MacOS/$(basename "$app" .app)" &
          pid=$!
          for i in $(seq 1 240); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null && { echo 'capture timed out'; exit 1; } || true
          ls -la ci_out

      - name: Plot performance
        shell: bash
        run: |
          pip install matplotlib
          python tool/plot_perf.py ci_out ${{ matrix.label }}
          for f in ci_out/*.png; do case "$(basename "$f")" in perf_*) ;; *) mv "$f" "ci_out/${{ matrix.label }}_$(basename "$f")";; esac; done

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.label }}
          path: ci_out/*.png
          if-no-files-found: error

  collect:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - run: ls -la results
      - uses: actions/upload-artifact@v4
        with:
          name: mi-glass-results
          path: results/*.png
